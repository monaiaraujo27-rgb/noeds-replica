<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dossiê Estratégico · Noeds</title>

<style>
:root{
  --bg:#faf9f6; --surface:#f2f0ea; --fg:#24252a; --muted:#5c5e66; --faint:#9a9ca4;
  --border:#e2e0d8; --line:#d9d7cd;
  --serif:'Instrument Serif',Georgia,serif; --sans:'Work Sans',ui-sans-serif,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
.df-wrap{min-height:100vh;}
/* topbar */
.df-top{position:fixed;top:0;left:0;right:0;z-index:40;background:rgba(250,249,246,.92);
  backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--border);}
.df-top-in{max-width:960px;margin:0 auto;padding:18px 32px;display:flex;align-items:center;gap:16px;}
.df-brand{font-family:var(--mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--fg);
  display:flex;align-items:center;gap:9px;}
.df-brand::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--fg);display:inline-block;}
.df-saved{margin-left:auto;font-size:13px;color:var(--faint);display:flex;align-items:center;gap:6px;}
.df-saved.on{color:var(--fg);}
.df-saved.on::before{content:"✓";}
.df-nav{max-width:960px;margin:0 auto;padding:0 32px;display:flex;gap:30px;overflow-x:auto;
  border-top:1px solid var(--border);}
.df-nav button{background:none;border:none;cursor:pointer;padding:15px 0;white-space:nowrap;
  font-family:var(--sans);font-size:15px;color:var(--faint);border-bottom:2px solid transparent;transition:color .15s;}
.df-nav button:hover{color:var(--muted);}
.df-nav button.on{color:var(--fg);border-bottom-color:var(--fg);}
.df-prog{max-width:960px;margin:0 auto;padding:0 32px 12px;display:flex;align-items:center;gap:14px;}
.df-prog-bar{flex:1;height:2px;background:var(--line);overflow:hidden;}
.df-prog-fill{height:100%;background:var(--fg);width:0;transition:width .4s;}
.df-prog-txt{font-family:var(--mono);font-size:13px;color:var(--faint);}
/* corpo */
.df-main{max-width:960px;margin:0 auto;padding:210px 32px 140px;}
.df-eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);}
.df-h2{font-family:var(--serif);font-weight:400;font-size:76px;line-height:.98;margin-top:12px;letter-spacing:-.01em;}
.df-sub{color:var(--muted);font-size:18px;margin-top:16px;font-weight:400;}
/* grid 2 colunas p/ campos curtos */
.df-grid{display:grid;grid-template-columns:1fr 1fr;gap:34px 48px;margin-top:40px;}
.df-grid .df-field{margin-top:0;}
.df-field{margin-top:34px;}
.df-field.full{grid-column:1 / -1;}
.df-label{font-size:15px;color:var(--fg);font-weight:500;margin-bottom:14px;display:block;}
.df-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
  color:var(--fg);padding:9px 0;font-family:var(--sans);font-size:18px;font-weight:400;}
.df-input::placeholder{color:var(--faint);font-weight:400;}
.df-input:focus{outline:none;border-bottom-color:var(--fg);}
textarea.df-input{min-height:120px;resize:vertical;line-height:1.6;}
.df-actions{margin-top:64px;display:flex;justify-content:space-between;gap:14px;}
.df-btn{display:inline-flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);
  border:none;padding:16px 32px;font-size:15px;font-weight:500;cursor:pointer;border-radius:999px;transition:opacity .15s;}
.df-btn:hover{opacity:.85;}
.df-btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);}
.df-btn.ghost:hover{border-color:var(--fg);opacity:1;}
.df-btn:disabled{opacity:.35;cursor:not-allowed;}
/* bloco de ofertas */
.df-oferta-item{border:1px solid var(--border);border-radius:10px;padding:20px;margin-top:16px;background:var(--surface);}
.df-oferta-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:16px;}
.df-oferta-grid .df-field{margin-top:0;}
.df-oferta-item .df-label{font-size:13px;color:var(--muted);}
.df-oferta-rm{background:none;border:none;color:var(--faint);cursor:pointer;font-size:13px;margin-top:14px;}
.df-oferta-rm:hover{color:var(--fg);}
.df-oferta-add{background:none;border:1px dashed var(--line);border-radius:999px;color:var(--muted);
  cursor:pointer;padding:12px 22px;margin-top:16px;font-size:14px;}
.df-oferta-add:hover{border-color:var(--fg);color:var(--fg);}
/* nota / aviso */
.df-nota{margin-top:32px;border-left:3px solid var(--fg);background:var(--surface);border-radius:0 8px 8px 0;
  padding:18px 22px;font-size:15px;line-height:1.6;color:var(--muted);}
/* escolhas fechadas (chips) */
.df-choices{display:flex;flex-wrap:wrap;gap:10px;margin-top:2px;}
.df-chip{background:transparent;border:1px solid var(--line);color:var(--muted);
  padding:11px 20px;font-family:var(--sans);font-size:15px;cursor:pointer;border-radius:999px;transition:all .15s;}
.df-chip:hover{border-color:var(--fg);color:var(--fg);}
.df-chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg);}
select.df-select{appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) center,calc(100% - 11px) center;background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;padding-right:34px;}
select.df-select option{color:#111;}
/* portão de código */
.df-gate{max-width:460px;margin:0 auto;padding:20vh 32px 0;}
.df-gate .df-h2{font-size:56px;}
.df-gate .df-input{font-size:19px;}
.df-gate .msg{color:#c0473f;font-size:14px;margin-top:12px;min-height:18px;}
.df-gate-acts{margin-top:26px;display:flex;gap:12px;}
/* página inicial (hero) - 2 colunas como os originais */
.df-hero{min-height:100vh;display:flex;align-items:center;}
.df-hero-in{max-width:1080px;margin:0 auto;padding:8vh 40px;display:grid;grid-template-columns:1.15fr .85fr;gap:64px;align-items:center;}
.df-hero-left .df-eyebrow{display:flex;align-items:center;gap:16px;}
.df-hero-left .df-eyebrow::after{content:"";height:1px;width:120px;background:var(--line);}
.df-hero-h1{font-family:var(--serif);font-weight:400;font-size:104px;line-height:.92;letter-spacing:-.02em;margin-top:28px;}
.df-hero-h1 em{font-style:italic;color:var(--muted);display:block;}
.df-hero-right{font-size:19px;line-height:1.62;color:var(--muted);}
.df-hero-right p{margin-bottom:20px;}
.df-hero-right p:last-of-type{color:var(--fg);font-weight:500;margin-bottom:0;}
.df-guide{margin-top:36px;border-top:1px solid var(--border);}
.df-guide-item{display:flex;gap:20px;padding:20px 0;border-bottom:1px solid var(--border);}
.df-guide-n{font-family:var(--mono);font-size:13px;color:var(--faint);letter-spacing:.08em;padding-top:3px;flex:none;}
.df-guide-t{font-size:16px;color:var(--fg);font-weight:500;}
.df-guide-d{font-size:15px;color:var(--muted);line-height:1.55;margin-top:5px;}
.df-guide-d strong{color:var(--fg);}
.df-hero-foot{margin-top:40px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.df-hero-dur{font-size:15px;color:var(--muted);}
.df-hero-dur strong{color:var(--fg);}
.df-done{max-width:680px;margin:0 auto;padding:14vh 32px 60px;text-align:center;}
.df-done .df-h2{font-size:80px;}
.df-done-next{margin-top:56px;border-top:1px solid var(--line);padding-top:40px;text-align:left;}
.df-done-next-h{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:20px;}
.df-done-steps{list-style:none;margin:0;padding:0;counter-reset:doneStep;}
.df-done-steps li{position:relative;padding-left:38px;margin-top:18px;font-size:15px;color:var(--muted);line-height:1.55;counter-increment:doneStep;}
.df-done-steps li::before{content:counter(doneStep);position:absolute;left:0;top:0;width:24px;height:24px;border:1px solid var(--line);
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--faint);}
.df-done-steps li strong{color:var(--fg);}
@media (max-width:820px){
  .df-hero-in{grid-template-columns:1fr;gap:36px;}
  .df-hero-h1{font-size:64px;} .df-h2{font-size:52px;}
  .df-grid{grid-template-columns:1fr;gap:0;} .df-grid .df-field{margin-top:34px;}
  .df-oferta-grid{grid-template-columns:1fr 1fr;} .df-main{padding:220px 22px 110px;}
}
</style>
</head>

const TERMOS={"clinica": {"rotulo": "Clínica", "cliente": "paciente", "clientes": "pacientes", "oferta": "procedimento", "ofertas": "procedimentos", "fechamento": "procedimento vendido", "historia": "História da clínica", "funil": ["Leads por mês", "Avaliações por mês", "Comparecimentos por mês", "Procedimentos vendidos por mês"]}, "servicos": {"rotulo": "Serviços", "cliente": "cliente", "clientes": "clientes", "oferta": "serviço", "ofertas": "serviços", "fechamento": "contrato", "historia": "História da empresa", "funil": ["Leads por mês", "Reuniões por mês", "Reuniões realizadas por mês", "Contratos por mês"]}, "produtos": {"rotulo": "Produtos", "cliente": "comprador", "clientes": "compradores", "oferta": "produto", "ofertas": "produtos", "fechamento": "pedido", "historia": "História da marca", "funil": ["Leads por mês", "Interesses por mês", "Visitas à loja por mês", "Pedidos por mês"]}};
const $=s=>document.querySelector(s);
const params=new URLSearchParams(location.search);
let CID=params.get("c")||"";              // id do link
let TIPO=(params.get("t")||"").toLowerCase();  // clinica|servicos|produtos (confirmado pelo modelo do banco)
if(!TERMOS[TIPO]) TIPO="clinica";
// "equipe=1" só pula o portão se vier ACOMPANHADO do código de acesso CORRETO
// DESTE cliente na URL (evita que ?equipe=1 sozinho seja bypass universal).
// Códigos são únicos por cliente agora — checagem é via RPC, assíncrona.
async function checarEquipe(){
  if(params.get("equipe")!=="1") return false;
  var cod=params.get("cod")||"";
  if(!cod) return false;
  try{
    var r=await fetch(SB_URL+"/rest/v1/rpc/check_access_code",{method:"POST",
      headers:{apikey:SB_ANON,Authorization:"Bearer "+SB_ANON,"Content-Type":"application/json"},
      body:JSON.stringify({rid:CID,code:cod})});
    return r.ok && (await r.json())===true;
  }catch(e){ return false; }
}
let DADOS={};                             // { secaoId: {campo:valor} }
let secAtual=0, saveTimer=null;

// resolve os tokens {cliente}/{clientes}/{oferta}/{ofertas}/{fechamento}/{historia}/{funilN}
// e capitaliza {Ofertas}. SECOES = SECOES_RAW já resolvido para o TIPO atual.
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
function resolverStr(s){
  if(typeof s!=="string") return s;
  const t=TERMOS[TIPO];
  return s.replace(/\{(\w+)\}/g,function(m,k){
    if(k==="Ofertas") return cap(t.ofertas);
    if(k==="funil0") return t.funil[0];
    if(k==="funil1") return t.funil[1];
    if(k==="funil2") return t.funil[2];
    if(k==="funil3") return t.funil[3];
    if(k==="historia") return t.historia;
    return (t[k]!=null? t[k] : m);
  });
}
function resolverCampo(c){ return [c[0], resolverStr(c[1]), c[2], c[3]]; }
function montarSecoes(){
  return SECOES_RAW.map(function(s){
    return {id:s.id,num:s.num,titulo:s.titulo,sub:resolverStr(s.sub),campos:s.campos.map(resolverCampo)};
  });
}
let SECOES=montarSecoes();

function esc(s){return (s==null?"":(""+s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function get(sec,campo){return (DADOS[sec]&&DADOS[sec][campo])||"";}
function set(sec,campo,val){ if(!DADOS[sec])DADOS[sec]={}; DADOS[sec][campo]=val; }

// ---- progresso: % de campos preenchidos (ofertas contam se tiver 1 item nomeado) ----
function calcProgresso(){
  let total=0, feitos=0;
  SECOES.forEach(s=>s.campos.forEach(c=>{
    if(c[2]==="nota")return;            // aviso: não é campo
    if(c[2]==="oferta"){
      total++; const its=(DADOS[s.id]&&DADOS[s.id].itens)||[];
      if(its.some(i=>i.nome&&i.nome.trim()))feitos++;
    }else{
      total++; if(get(s.id,c[0]).toString().trim())feitos++;
    }
  }));
  return total?Math.round(feitos/total*100):0;
}

// ---- Supabase (autosave via RPC upsert_resposta: anon não tem SELECT, então PATCH não serve) ----
async function sbUpsert(prog,status){
  const emp=DADOS.empresa||{};
  const r=await fetch(SB_URL+"/rest/v1/rpc/upsert_resposta",{method:"POST",
    headers:{apikey:SB_ANON,Authorization:"Bearer "+SB_ANON,"Content-Type":"application/json"},
    body:JSON.stringify({rid:CID, p_clinica:emp.nome||"", p_responsavel:emp.responsavel||"",
      p_status:status, p_progresso:prog, p_dados:DADOS, p_modelo:TIPO})});
  // fetch só rejeita em erro de rede — status HTTP 4xx/5xx resolve normalmente.
  // Sem checar r.ok aqui, um erro do RPC (ex: payload acima do limite) passava
  // batido e sbSave mostrava "Salvo" mesmo sem nada ter sido persistido.
  if(!r.ok){ let msg="falhou ("+r.status+")"; try{ const j=await r.json(); msg=j.message||msg; }catch(e){} throw new Error(msg); }
}
async function sbCreate(){ await sbUpsert(0,"nao-iniciado"); }
async function sbLoad(){
  const r=await fetch(SB_URL+"/rest/v1/rpc/get_resposta_by_id",{method:"POST",
    headers:{apikey:SB_ANON,Authorization:"Bearer "+SB_ANON,"Content-Type":"application/json"},
    body:JSON.stringify({rid:CID})});
  if(!r.ok)return null;
  const rows=await r.json();
  return Array.isArray(rows)&&rows.length?rows[0]:null;
}
async function sbSave(){
  const prog=calcProgresso();
  const status=prog>=100?"concluido":(prog>0?"andamento":"nao-iniciado");
  markSaving();
  try{ await sbUpsert(prog,status); markSaved(); }
  catch(e){ const el=$("#df-saved"); if(el){el.textContent="Erro ao salvar";el.classList.remove("on");} }
  updProg();
}
function markSaving(){const e=$("#df-saved");if(e){e.textContent="Salvando…";e.classList.remove("on");}}
function markSaved(){const e=$("#df-saved");if(e){e.textContent="Salvo";e.classList.add("on");}}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(sbSave,900);}

// ---- render ----
function updProg(){
  const p=calcProgresso();
  const f=$("#df-fill"); if(f)f.style.width=p+"%";
  const t=$("#df-progtxt"); if(t)t.textContent=(secAtual+1)+" de "+SECOES.length;
}
function renderNav(){
  const nav=$("#df-nav"); nav.innerHTML="";
  SECOES.forEach((s,i)=>{
    const b=document.createElement("button"); b.textContent=s.titulo;
    if(i===secAtual)b.classList.add("on");
    b.onclick=()=>{secAtual=i;renderSecao();};
    nav.appendChild(b);
  });
}
function renderSecao(){
  renderNav(); updProg();
  const s=SECOES[secAtual];
  const m=$("#df-main");
  let h='<div class="df-eyebrow">Seção '+s.num+'</div>'
    +'<h2 class="df-h2">'+esc(s.titulo)+'</h2>'
    +'<p class="df-sub">'+esc(s.sub)+'</p>';
  // campos "curtos" (text/select) vão num grid de 2 colunas; os demais, largura total.
  function ehCurto(tipo){ return tipo==="text"||tipo==="select"; }
  function campoHtml(c){
    const [key,label,tipo,ph]=c;
    const val=esc(get(s.id,key));
    let inner='<label class="df-label">'+esc(label)+'</label>';
    if(tipo==="area"){
      inner+='<textarea class="df-input" data-k="'+key+'" maxlength="4000" placeholder="'+esc(ph)+'">'+val+'</textarea>';
    }else if(tipo==="radio"||tipo==="checkbox"){
      const multi=tipo==="checkbox";
      const cur=multi?get(s.id,key).split("; ").filter(Boolean):get(s.id,key);
      inner+='<div class="df-choices" data-choice="'+key+'" data-multi="'+(multi?1:0)+'">';
      (ph||[]).forEach(op=>{
        const on=multi?(cur.indexOf(op)>=0?" on":""):(cur===op?" on":"");
        inner+='<button type="button" class="df-chip'+on+'" data-op="'+esc(op)+'">'+esc(op)+'</button>';
      });
      inner+='</div>';
    }else if(tipo==="select"){
      const cur=get(s.id,key);
      inner+='<select class="df-input df-select" data-k="'+key+'"><option value="">Selecione…</option>';
      (ph||[]).forEach(op=>{ inner+='<option'+(cur===op?" selected":"")+'>'+esc(op)+'</option>'; });
      inner+='</select>';
    }else{
      inner+='<input class="df-input" data-k="'+key+'" maxlength="500" placeholder="'+esc(ph)+'" value="'+val+'">';
    }
    return '<div class="df-field">'+inner+'</div>';
  }
  // agrupa campos curtos consecutivos em .df-grid
  let i=0;
  while(i<s.campos.length){
    const c=s.campos[i];
    const tipo=c[2];
    if(tipo==="oferta"){ h+=renderOferta(s.id); i++; continue; }
    if(tipo==="nota"){ h+='<div class="df-nota">'+esc(c[3])+'</div>'; i++; continue; }
    if(ehCurto(tipo)){
      let grupo="";
      while(i<s.campos.length && ehCurto(s.campos[i][2])){ grupo+=campoHtml(s.campos[i]); i++; }
      h+='<div class="df-grid">'+grupo+'</div>';
    }else{
      h+=campoHtml(c); i++;
    }
  }
  h+='<div class="df-actions">'
    +'<button class="df-btn ghost" id="df-prev"'+(secAtual===0?' disabled':'')+'>← Anterior</button>'
    +'<button class="df-btn" id="df-next">'+(secAtual===SECOES.length-1?'Concluir':'Próxima →')+'</button>'
    +'</div>';
  m.innerHTML=h;
  // bind inputs (text/area/select - todos têm data-k)
  m.querySelectorAll(".df-input[data-k]").forEach(inp=>{
    const ev=inp.tagName==="SELECT"?"change":"input";
    inp.addEventListener(ev,()=>{set(s.id,inp.dataset.k,inp.value);scheduleSave();});
  });
  // bind escolhas fechadas (radio/checkbox via chips)
  m.querySelectorAll(".df-choices").forEach(box=>{
    const key=box.dataset.choice, multi=box.dataset.multi==="1";
    box.querySelectorAll(".df-chip").forEach(chip=>{
      chip.addEventListener("click",()=>{
        if(multi){
          chip.classList.toggle("on");
          const sel=[].slice.call(box.querySelectorAll(".df-chip.on")).map(c=>c.dataset.op);
          set(s.id,key,sel.join("; "));
        }else{
          const was=chip.classList.contains("on");
          box.querySelectorAll(".df-chip").forEach(c=>c.classList.remove("on"));
          if(!was){chip.classList.add("on");set(s.id,key,chip.dataset.op);}
          else set(s.id,key,"");   // clicar de novo desmarca
        }
        scheduleSave();
      });
    });
  });
  bindOferta(s.id);
  $("#df-prev")&&($("#df-prev").onclick=()=>{if(secAtual>0){secAtual--;renderSecao();window.scrollTo(0,0);}});
  $("#df-next").onclick=()=>{
    sbSave();
    if(secAtual<SECOES.length-1){secAtual++;renderSecao();window.scrollTo(0,0);}
    else showDone();
  };
  window.scrollTo(0,0);
}
function ofertaItens(sec){ if(!DADOS[sec])DADOS[sec]={}; if(!Array.isArray(DADOS[sec].itens))DADOS[sec].itens=[]; return DADOS[sec].itens; }
function renderOferta(sec){
  const its=ofertaItens(sec);
  const t=TERMOS[TIPO], og=cap(t.ofertas), os=cap(t.oferta);
  if(!its.length){its.push({nome:"",ticket:"",margem:"",volume:""});}
  let h='<div class="df-field"><label class="df-label">'+esc(og)+'</label>'
    +'<p class="df-sub" style="margin-top:0;font-size:13px">Liste seus principais '+esc(t.ofertas)+' com ticket, margem e volume mensal.</p>'
    +'<div id="df-ofertas">';
  its.forEach((it,idx)=>{
    h+='<div class="df-oferta-item" data-idx="'+idx+'"><div class="df-oferta-grid">'
      +'<div class="df-field"><label class="df-label">'+esc(os)+'</label><input class="df-input" data-of="nome" maxlength="200" value="'+esc(it.nome)+'"></div>'
      +'<div class="df-field"><label class="df-label">Ticket (R$)</label><input class="df-input" data-of="ticket" maxlength="50" value="'+esc(it.ticket)+'"></div>'
      +'<div class="df-field"><label class="df-label">Margem (%)</label><input class="df-input" data-of="margem" maxlength="50" value="'+esc(it.margem)+'"></div>'
      +'<div class="df-field"><label class="df-label">Volume/mês</label><input class="df-input" data-of="volume" maxlength="50" value="'+esc(it.volume)+'"></div>'
      +'</div>'+(its.length>1?'<button class="df-oferta-rm" data-rm="'+idx+'">Remover</button>':'')+'</div>';
  });
  h+='</div><button class="df-oferta-add" type="button">+ Adicionar '+esc(t.oferta)+'</button></div>';
  return h;
}
function bindOferta(sec){
  const wrap=$("#df-ofertas"); if(!wrap)return;
  const its=ofertaItens(sec);
  wrap.querySelectorAll(".df-oferta-item").forEach(item=>{
    const idx=+item.dataset.idx;
    item.querySelectorAll(".df-input[data-of]").forEach(inp=>{
      inp.addEventListener("input",()=>{its[idx][inp.dataset.of]=inp.value;scheduleSave();});
    });
    const rm=item.querySelector("[data-rm]");
    if(rm)rm.onclick=()=>{its.splice(idx,1);scheduleSave();renderSecao();};
  });
  const add=$(".df-oferta-add");
  if(add)add.onclick=()=>{its.push({nome:"",ticket:"",margem:"",volume:""});scheduleSave();renderSecao();};
}

async function iniciar(){
  const app=$("#df-app");
  app.innerHTML=''
    +'<div class="df-top"><div class="df-top-in"><span class="df-brand">Noeds · Dossiê</span>'
    +'<span class="df-saved on" id="df-saved">Salvo</span></div>'
    +'<div class="df-nav" id="df-nav"></div>'
    +'<div class="df-prog"><div class="df-prog-bar"><div class="df-prog-fill" id="df-fill"></div></div>'
    +'<span class="df-prog-txt" id="df-progtxt">1 de '+SECOES.length+'</span></div></div>'
    +'<div class="df-main" id="df-main"></div>';
  // carregar existente
  const row=await sbLoad();
  if(row){
    DADOS=row.dados||{};
    // o modelo salvo no banco é a fonte da verdade do TIPO
    if(row.modelo && TERMOS[row.modelo] && row.modelo!==TIPO){ TIPO=row.modelo; SECOES=montarSecoes(); }
  }
  else { await sbCreate(); DADOS={}; }
  renderSecao();
}

// ---- boot ----
(async function(){
  if(!CID){ CID="dossie-"+Math.random().toString(36).slice(2,10)+"-"+Math.random().toString(36).slice(2,7);
    history.replaceState(null,"","?c="+CID+"&t="+TIPO); }
  // equipe preenchendo internamente (ou já autenticada nesta sessão) pula o portão
  if(sessionStorage.getItem("df_ok")==="1" || await checarEquipe()) iniciar(); else showWelcome();
})();
</script>
